name: ClashForge
on:
  #schedule:
  #  - cron: '0 7-22/5 * * *'
  workflow_dispatch:

jobs:
  run_demo_actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # 删掉 token: ${{ secrets.BOT }}，完全不用密钥

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requirements.txt
        run: |
          pip install -r ./requirements.txt

      - name: Run ClashForge.py
        run: python ClashForge.py

      # 不再执行 git commit / git push（删掉那一大段push代码）

      # ✅ 增加制品上传：运行结束可以在Actions页面下载 clash_config.yaml
      - name: Upload generated config file
        uses: actions/upload-artifact@v4
        with:
          name: clash_config_output
          path: clash_config.yaml
